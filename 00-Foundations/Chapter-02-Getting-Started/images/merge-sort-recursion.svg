<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650">
<rect width="1200" height="650" rx="24" fill="#f8fafc"/>
<text x="55" y="60" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Merge sort: divide, sort, merge</text>
<text x="55" y="98" font-family="Arial,sans-serif" font-size="20" fill="#475569">Example input [3, 41, 52, 26, 38, 57, 9, 49]</text>
<g font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#0f172a">
<rect x="360" y="130" width="480" height="54" rx="12" fill="#e2e8f0"/><text x="600" y="165">3  41  52  26  38  57  9  49</text>
<path d="M600 184 V210 M600 210 L330 250 M600 210 L870 250" stroke="#64748b" stroke-width="3" fill="none"/>
<rect x="90" y="250" width="480" height="54" rx="12" fill="#dbeafe"/><text x="330" y="285">3  41  52  26</text>
<rect x="630" y="250" width="480" height="54" rx="12" fill="#dbeafe"/><text x="870" y="285">38  57  9  49</text>
<path d="M330 304 V330 M330 330 L210 365 M330 330 L450 365 M870 304 V330 M870 330 L750 365 M870 330 L990 365" stroke="#64748b" stroke-width="3" fill="none"/>
<rect x="80" y="365" width="260" height="52" rx="10" fill="#fff" stroke="#94a3b8"/><text x="210" y="399">3  41</text>
<rect x="320" y="365" width="260" height="52" rx="10" fill="#fff" stroke="#94a3b8"/><text x="450" y="399">52  26</text>
<rect x="620" y="365" width="260" height="52" rx="10" fill="#fff" stroke="#94a3b8"/><text x="750" y="399">38  57</text>
<rect x="860" y="365" width="260" height="52" rx="10" fill="#fff" stroke="#94a3b8"/><text x="990" y="399">9  49</text>
</g>
<text x="600" y="475" font-family="Arial,sans-serif" font-size="22" font-weight="700" text-anchor="middle" fill="#334155">Sort tiny pieces, then merge sorted runs</text>
<g font-family="Arial,sans-serif" font-size="23" font-weight="700" text-anchor="middle">
<rect x="170" y="510" width="390" height="58" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="365" y="547" fill="#166534">3  26  41  52</text>
<rect x="640" y="510" width="390" height="58" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/><text x="835" y="547" fill="#166534">9  38  49  57</text>
<path d="M365 568 V590 H600 M835 568 V590 H600 V610" stroke="#16a34a" stroke-width="3" fill="none"/>
<rect x="330" y="590" width="540" height="48" rx="10" fill="#bbf7d0" stroke="#16a34a" stroke-width="2"/><text x="600" y="622" fill="#166534" font-size="22">3  9  26  38  41  49  52  57</text>
</g>
</svg>