<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<rect width="1200" height="520" rx="24" fill="#f8fafc"/>
<text x="60" y="62" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0f172a">Insertion sort: the playing-card idea</text>
<text x="60" y="100" font-family="Arial,sans-serif" font-size="20" fill="#475569">Keep the cards in your hand sorted; insert each new card into its correct position.</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<text x="205" y="160" font-size="21" font-weight="700" fill="#334155">1. Pick up 5</text>
<text x="205" y="190" font-size="16" fill="#64748b">Sorted hand</text>
<rect x="150" y="210" width="110" height="150" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="3"/><text x="205" y="300" font-size="54" font-weight="700" fill="#2563eb">5</text>
<text x="205" y="400" font-size="16" fill="#64748b">Next: 2</text>
<text x="495" y="160" font-size="21" font-weight="700" fill="#334155">2. Insert 2</text>
<text x="495" y="190" font-size="16" fill="#64748b">2 belongs before 5</text>
<rect x="390" y="210" width="95" height="150" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/><text x="437" y="300" font-size="50" font-weight="700" fill="#1d4ed8">2</text>
<rect x="500" y="210" width="95" height="150" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="3"/><text x="547" y="300" font-size="50" font-weight="700" fill="#0f172a">5</text>
<text x="495" y="400" font-size="16" fill="#64748b">Sorted hand: 2, 5</text>
<text x="835" y="160" font-size="21" font-weight="700" fill="#334155">3. Insert 4</text>
<text x="835" y="190" font-size="16" fill="#64748b">Shift 5; place 4</text>
<rect x="700" y="210" width="95" height="150" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="3"/><text x="747" y="300" font-size="50" font-weight="700" fill="#0f172a">2</text>
<rect x="810" y="210" width="95" height="150" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/><text x="857" y="300" font-size="50" font-weight="700" fill="#1d4ed8">4</text>
<rect x="920" y="210" width="95" height="150" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="3"/><text x="967" y="300" font-size="50" font-weight="700" fill="#0f172a">5</text>
<text x="835" y="400" font-size="16" fill="#64748b">Sorted hand: 2, 4, 5</text>
</g>
<path d="M290 285 H350 M620 285 H665" stroke="#64748b" stroke-width="4" fill="none"/><path d="M340 275 L352 285 L340 295 M655 275 L667 285 L655 295" stroke="#64748b" stroke-width="4" fill="none"/>
<text x="60" y="475" font-family="Arial,sans-serif" font-size="18" fill="#475569">Key idea: insert one item at a time into the already-sorted prefix.</text>
</svg>