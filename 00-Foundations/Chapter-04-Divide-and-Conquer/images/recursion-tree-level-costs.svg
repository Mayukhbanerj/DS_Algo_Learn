<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
<rect width="1400" height="720" rx="24" fill="#f8fafc"/>
<text x="60" y="70" font-family="Arial,sans-serif" font-size="38" font-weight="700" fill="#0f172a">Recursion tree for T(n) = aT(n/b) + f(n)</text>
<g stroke="#64748b" stroke-width="2.5" fill="none">
<path d="M700 170 L430 285 M700 170 L970 285"/>
<path d="M430 345 L270 445 M430 345 L590 445"/>
<path d="M970 345 L810 445 M970 345 L1130 445"/>
</g>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="590" y="115" width="220" height="78" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="700" y="163" font-size="27" font-weight="700" fill="#1e3a8a">f(n)</text>
<rect x="320" y="285" width="220" height="72" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="430" y="329" font-size="25" fill="#0c4a6e">f(n/b)</text>
<rect x="860" y="285" width="220" height="72" rx="14" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="970" y="329" font-size="25" fill="#0c4a6e">f(n/b)</text>
<rect x="180" y="445" width="180" height="66" rx="13" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="270" y="486" font-size="23" fill="#78350f">f(n/b²)</text>
<rect x="500" y="445" width="180" height="66" rx="13" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="590" y="486" font-size="23" fill="#78350f">f(n/b²)</text>
<rect x="720" y="445" width="180" height="66" rx="13" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="810" y="486" font-size="23" fill="#78350f">f(n/b²)</text>
<rect x="1040" y="445" width="180" height="66" rx="13" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
<text x="1130" y="486" font-size="23" fill="#78350f">f(n/b²)</text>
</g>
<g font-family="Arial,sans-serif" fill="#334155">
<text x="60" y="575" font-size="25" font-weight="700">Depth j</text>
<text x="250" y="575" font-size="25">aʲ nodes</text>
<text x="510" y="575" font-size="25">each has subproblem n / bʲ</text>
<text x="950" y="575" font-size="25">level cost = aʲ f(n / bʲ)</text>
<path d="M60 610 H1340" stroke="#cbd5e1" stroke-width="2"/>
<text x="60" y="660" font-size="24" fill="#475569">Leaves at depth about log_b n contribute Θ(n^(log_b a)); sum internal levels to obtain the total.</text>
</g>
</svg>