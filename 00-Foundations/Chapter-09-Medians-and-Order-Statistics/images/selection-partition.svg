<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360">
<rect width="960" height="360" fill="#ffffff"/>
<text x="480" y="34" font-family="Arial,sans-serif" font-size="22" text-anchor="middle" fill="#172033">Selection follows only the partition containing the target rank</text>
<rect x="55" y="80" width="850" height="72" rx="10" fill="#e8eef8" stroke="#49658a" stroke-width="2"/>
<text x="480" y="110" font-family="Arial,sans-serif" font-size="18" text-anchor="middle" fill="#172033">Current subarray: n elements</text>
<text x="480" y="135" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#172033">Random pivot partition; pivot has rank k</text>
<path d="M480 152 V190 H255 V220 M480 190 H705 V220" fill="none" stroke="#49658a" stroke-width="2"/>
<rect x="75" y="220" width="360" height="76" rx="10" fill="#e9f5ee" stroke="#43835c" stroke-width="2"/>
<rect x="525" y="220" width="360" height="76" rx="10" fill="#fff1e5" stroke="#b97835" stroke-width="2"/>
<text x="255" y="249" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#172033">Lower partition</text>
<text x="255" y="274" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#172033">If i &lt; k: recurse with rank i</text>
<text x="705" y="249" font-family="Arial,sans-serif" font-size="17" text-anchor="middle" fill="#172033">Upper partition</text>
<text x="705" y="274" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#172033">If i &gt; k: recurse with rank i − k</text>
<text x="480" y="335" font-family="Arial,sans-serif" font-size="15" text-anchor="middle" fill="#172033">If i = k, return the pivot. Unlike quicksort, only one side is processed.</text>
</svg>