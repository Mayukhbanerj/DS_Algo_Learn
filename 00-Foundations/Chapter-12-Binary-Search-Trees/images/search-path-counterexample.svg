<svg xmlns="http://www.w3.org/2000/svg" width="760" height="360" viewBox="0 0 760 360">
<rect width="760" height="360" fill="#ffffff"/>
<text x="380" y="30" font-family="Arial" font-size="20" text-anchor="middle" fill="#172033">BST search path counterexample (Exercise 12.2-4)</text>
<g stroke="#64748b" stroke-width="2" fill="none">
<path d="M380 85 L240 155 M380 85 L520 155 M240 155 L160 235"/>
</g>
<g fill="#dbeafe" stroke="#2563eb" stroke-width="2">
<circle cx="380" cy="85" r="25"/><circle cx="240" cy="155" r="25"/><circle cx="520" cy="155" r="25"/>
<circle cx="160" cy="235" r="25"/>
</g>
<g font-family="Arial" font-size="17" text-anchor="middle" fill="#172033">
<text x="380" y="91">2</text><text x="240" y="161">4</text><text x="520" y="161">5</text><text x="160" y="241">3</text>
</g>
<g stroke="#64748b" stroke-width="2" fill="none" stroke-dasharray="5 4"><path d="M160 260 L160 300"/></g>
<text x="160" y="326" font-family="Arial" font-size="15" text-anchor="middle" fill="#b45309">2.5 (A)</text>
<text x="380" y="122" font-family="Arial" font-size="14" fill="#2563eb">B: search path</text>
<text x="520" y="205" font-family="Arial" font-size="14" text-anchor="middle" fill="#0f766e">5 (C)</text>
<text x="160" y="281" font-family="Arial" font-size="14" text-anchor="middle" fill="#b45309">left of path</text>
<text x="380" y="345" font-family="Arial" font-size="13" text-anchor="middle" fill="#475569">Search k = 3.5: 2 → 4 → 3 → NIL; A contains 2.5, so 2.5 ≤ 2 fails.</text>
</svg>