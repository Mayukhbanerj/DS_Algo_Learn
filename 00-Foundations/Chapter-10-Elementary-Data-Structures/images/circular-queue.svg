<svg xmlns="http://www.w3.org/2000/svg" width="920" height="360" viewBox="0 0 920 360">
<rect width="920" height="360" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#172033">
<text x="40" y="38" font-size="22" font-weight="bold">Circular queue — one unused slot</text>
<text x="40" y="66" font-size="14">head points to the first item; tail points to the next free slot. Indices wrap around.</text>
</g>
<g stroke="#334155" stroke-width="2" fill="#f8fafc">
<rect x="60" y="110" width="105" height="72" rx="8"/><rect x="175" y="110" width="105" height="72" rx="8"/><rect x="290" y="110" width="105" height="72" rx="8"/><rect x="405" y="110" width="105" height="72" rx="8"/><rect x="520" y="110" width="105" height="72" rx="8"/><rect x="635" y="110" width="105" height="72" rx="8"/>
</g>
<g font-family="Arial" font-size="14" text-anchor="middle" fill="#172033">
<text x="112" y="137">slot 1</text><text x="112" y="163" font-weight="bold">4</text>
<text x="227" y="137">slot 2</text><text x="227" y="163" font-weight="bold">1</text>
<text x="342" y="137">slot 3</text><text x="342" y="163" font-weight="bold">3</text>
<text x="457" y="137">slot 4</text><text x="457" y="163">empty</text>
<text x="572" y="137">slot 5</text><text x="572" y="163">empty</text>
<text x="687" y="137">slot 6</text><text x="687" y="163">empty</text>
</g>
<g stroke="#0f766e" stroke-width="3" fill="none"><path d="M112 92 L112 105"/><path d="M457 92 L457 105"/></g>
<g font-family="Arial" font-size="15" fill="#0f766e" font-weight="bold" text-anchor="middle"><text x="112" y="86">head</text><text x="457" y="86">tail</text></g>
<g font-family="Arial" font-size="14" fill="#334155"><text x="60" y="235">Logical queue: 4 → 1 → 3</text><text x="60" y="262">Next enqueue writes at tail; dequeue advances head.</text><text x="60" y="289">One slot stays unused so head = tail means empty and NEXT(tail) = head means full.</text></g>
<path d="M760 145 C835 145 850 210 790 240" fill="none" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5"/>
<path d="M785 232 L790 240 L800 235" fill="none" stroke="#64748b" stroke-width="2"/>
<text x="790" y="275" font-family="Arial" font-size="13" fill="#475569" text-anchor="middle">wraparound</text>
</svg>