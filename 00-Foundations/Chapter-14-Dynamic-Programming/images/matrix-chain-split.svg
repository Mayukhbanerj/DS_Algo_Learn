<svg xmlns="http://www.w3.org/2000/svg" width="820" height="270" viewBox="0 0 820 270">
<rect width="820" height="270" fill="#fff"/>
<text x="410" y="28" font-family="Arial" font-size="20" text-anchor="middle" fill="#172033">Matrix-chain DP: one interval, all candidate splits</text>
<g font-family="Arial" font-size="16" text-anchor="middle" fill="#172033">
<rect x="330" y="52" width="160" height="44" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="410" y="80">m[i,j]</text>
<rect x="80" y="168" width="190" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="175" y="196">m[i,k]</text>
<rect x="550" y="168" width="190" height="44" rx="8" fill="#dcfce7" stroke="#16a34a"/><text x="645" y="196">m[k+1,j]</text>
</g>
<g stroke="#64748b" stroke-width="2" fill="none"><path d="M370 96 L220 168 M450 96 L600 168"/></g>
<text x="410" y="132" font-family="Arial" font-size="14" text-anchor="middle" fill="#475569">try every i ≤ k &lt; j</text>
<text x="410" y="238" font-family="Arial" font-size="14" text-anchor="middle" fill="#475569">candidate = left cost + right cost + p(i−1)·p(k)·p(j)</text>
</svg>