<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350">
<rect width="1000" height="350" fill="#fff"/>
<text x="500" y="28" text-anchor="middle" font-family="Arial" font-size="20" fill="#172033">Red-black deletion fixup cases (x is a left child)</text>
<g font-family="Arial" font-size="14" text-anchor="middle" fill="#172033">
<text x="125" y="62">1. Red sibling</text><text x="375" y="62">2. Black sibling,</text><text x="375" y="80">two black children</text>
<text x="625" y="62">3. Near red child,</text><text x="625" y="80">far black child</text>
<text x="875" y="62">4. Far red child</text>
</g>
<g stroke="#64748b" stroke-width="2" fill="none">
<path d="M125 115 L70 195 M125 115 L180 195 M375 115 L320 195 M375 115 L430 195 M625 115 L570 195 M625 115 L680 195 M875 115 L820 195 M875 115 L930 195"/>
</g>
<g stroke="#1e293b" stroke-width="2">
<circle cx="125" cy="115" r="22" fill="#111827"/><circle cx="70" cy="195" r="22" fill="#111827"/><circle cx="180" cy="195" r="22" fill="#dc2626"/>
<circle cx="375" cy="115" r="22" fill="#111827"/><circle cx="320" cy="195" r="22" fill="#111827"/><circle cx="430" cy="195" r="22" fill="#111827"/>
<circle cx="625" cy="115" r="22" fill="#111827"/><circle cx="570" cy="195" r="22" fill="#dc2626"/><circle cx="680" cy="195" r="22" fill="#111827"/>
<circle cx="875" cy="115" r="22" fill="#111827"/><circle cx="820" cy="195" r="22" fill="#111827"/><circle cx="930" cy="195" r="22" fill="#dc2626"/>
</g>
<g font-family="Arial" font-size="13" text-anchor="middle" fill="#fff">
<text x="125" y="120">p</text><text x="70" y="200">x</text><text x="180" y="200">w</text>
<text x="375" y="120">p</text><text x="320" y="200">x</text><text x="430" y="200">w</text>
<text x="625" y="120">p</text><text x="570" y="200">x</text><text x="680" y="200">w</text>
<text x="875" y="120">p</text><text x="820" y="200">x</text><text x="930" y="200">w</text>
</g>
<g font-family="Arial" font-size="12" text-anchor="middle" fill="#334155">
<text x="125" y="245">Recolor sibling black,</text><text x="125" y="262">parent red; rotate left</text>
<text x="375" y="245">Color sibling red;</text><text x="375" y="262">move extra black up</text>
<text x="625" y="245">Rotate right at sibling</text><text x="625" y="262">to create case 4</text>
<text x="875" y="245">Recolor and rotate left</text><text x="875" y="262">at parent; finish</text>
</g>
<text x="500" y="320" font-family="Arial" font-size="13" text-anchor="middle" fill="#64748b">The right-child branch mirrors these cases. Case 2 alone repeats; cases 1, 3, and 4 use at most three rotations.</text>
</svg>